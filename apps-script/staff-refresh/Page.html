<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 32px 20px; background: #faf7f2; color: #222; }
      main { max-width: 420px; margin: 0 auto; text-align: center; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { line-height: 1.45; }
      button { font-size: 20px; padding: 16px 28px; border: 0; border-radius: 10px; background: #1f5f3a; color: #fff; width: 100%; }
      button:disabled { background: #8a9a8f; }
      #status { min-height: 3em; margin-top: 20px; }
    </style>
  </head>
  <body>
    <main id="app" data-key="<?= key ?>">
      <h1>Refresh the website</h1>
      <p>Changed a special in Toast? Publish it in Toast first, then press this to update theflytrapferndale.com now.</p>
      <button id="go" type="button">Refresh specials now</button>
      <p id="status" role="status"></p>
    </main>
    <script>
      var KEY = document.getElementById('app').getAttribute('data-key');
      var btn = document.getElementById('go');
      var status = document.getElementById('status');
      btn.addEventListener('click', function () {
        btn.disabled = true;
        status.textContent = 'Starting...';
        google.script.run
          .withSuccessHandler(function (r) { status.textContent = r.message; if (!r.ok) btn.disabled = false; })
          .withFailureHandler(function () { status.textContent = 'Something went wrong. Try again in a minute.'; btn.disabled = false; })
          .requestRefresh(KEY);
      });
    </script>
  </body>
</html>

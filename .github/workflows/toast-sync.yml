name: Toast sync

# Single scheduled bot that pulls EVERYTHING the site shows from Toast (the
# source of truth) and commits the result to main so Pages redeploys:
#   - assets/menu.json        the full standing menu       (toast-sync.mjs)
#   - data.js SPECIALS block   weekly specials + photos     (specials-sync.mjs)
#   - data.js EXTRAS block      soup + mini-muffin           (specials-sync.mjs)
#
# Both pulls run in ONE job and produce ONE commit, so the two syncs can never
# race each other on push — the reason this replaced the old split
# specials-sync + toast-menu-sync workflows. A `git pull --rebase` before push
# also absorbs any human commit that landed on main mid-run.
#
# On every run it pulls the full Toast menu and compares it to what is
# committed; if the content is identical it commits nothing and skips. The
# comparison is on content, never on Toast's lastUpdated timestamp - that tracks
# menu publishes, not edits, and it missed a pulled special and a changed soup for
# three days in September 2026. No-op until the TOAST_* secrets are set, so it is safe to merge before
# credentials are installed. Each script writes nothing on any Toast/network
# error, so the last-good committed menu/specials stay live — a Toast outage
# never blanks the site. The Toast credential needs the `menus:read` scope.
#
# Required repo secrets: TOAST_CLIENT_ID, TOAST_CLIENT_SECRET, TOAST_RESTAURANT_GUID
# Optional: TOAST_HOSTNAME, TOAST_VEG_MARKER, TOAST_SPECIALS_GROUP, TOAST_EXCLUDE_GROUPS

on:
  schedule:
    # We ask for every 15 minutes. GitHub gives us roughly one run every three
    # hours: measured over 27 days this workflow fired 0.30 times/hour against
    # the 4.0 it asks for, at minutes scattered uniformly across the hour rather
    # than at 2/17/32/47.
    #
    # Do not try to fix that here. site-health.yml asks for the same frequency at
    # different minutes and gets an identical 0.31/hour, firing a median of 7
    # minutes away from this one - the scheduler wakes per REPO, not per workflow,
    # so more cron lines and different offsets change nothing. Escaping it needs a
    # trigger outside GitHub's scheduler; declined in Sept 2026 as not worth the
    # moving parts. See docs/ARCHITECTURE.md#the-schedule-is-not-15-minutes.
    #
    # This costs freshness only, never correctness: change detection is on content,
    # so whichever run does fire catches everything since the last one. Press
    # Actions -> Toast sync -> Run workflow when something needs to be live now.
    # Most runs are a no-op (nothing committed unless Toast actually changed).
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify only — pull from Toast and log, write/commit nothing'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: toast-sync
  cancel-in-progress: false

jobs:
  # Circuit breaker. An automatic rollback creates .github/SYNC_PAUSED when a
  # synced deploy fails verification. Without this gate the next scheduled run
  # re-pulls the same bad Toast data, the rollback fires again, and the two trade
  # commits on every run until a human notices.
  #
  # Its own job rather than a first step so a paused run shows as SKIPPED. A step
  # that exited non-zero would post a red X and a failure email four times an
  # hour for as long as the pause lasts, drowning the incident it belongs to.
  #
  # Deleting the file is the deliberate act that resumes syncing, and it is meant
  # to happen only once the underlying Toast item or sync bug is fixed. The site
  # keeps serving the last verified-good content meanwhile.
  guard:
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.check.outputs.paused }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Only .github is needed to read the flag; skip the image assets.
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
      - id: check
        run: |
          if [ -f .github/SYNC_PAUSED ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Toast sync is paused by .github/SYNC_PAUSED — skipping this run."
            {
              echo "## Toast sync is paused"
              echo
              echo '```'
              cat .github/SYNC_PAUSED
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: guard
    if: needs.guard.outputs.paused != 'true'
    runs-on: ubuntu-latest
    env:
      TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
      TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
      TOAST_RESTAURANT_GUID: ${{ secrets.TOAST_RESTAURANT_GUID }}
      TOAST_HOSTNAME: ${{ secrets.TOAST_HOSTNAME }}
      TOAST_VEG_MARKER: ${{ secrets.TOAST_VEG_MARKER }}
      TOAST_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pull full menu from Toast
        env:
          TOAST_EXCLUDE_GROUPS: ${{ secrets.TOAST_EXCLUDE_GROUPS }}
          # Save the pulled /menus payload so the specials step can reuse it.
          TOAST_PAYLOAD_OUT: ${{ runner.temp }}/toast-menus.json
        run: node .github/scripts/toast-sync.mjs

      - name: Update specials + soup + muffin from the shared payload
        env:
          TOAST_SPECIALS_GROUP: ${{ secrets.TOAST_SPECIALS_GROUP }}
          # Reuse the menu step's payload instead of calling /menus again — Toast
          # caps GET /menus at 1 req/sec per location, so a second call 429s.
          TOAST_PAYLOAD_IN: ${{ runner.temp }}/toast-menus.json
        run: node .github/scripts/specials-sync.mjs

      - name: Commit + push if anything changed
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git add -- assets/menu.json data.js docs/specials-history.json
          # assets/specials/ is tracked via its .gitkeep, but stay defensive: a
          # missing pathspec is fatal to `git add`, and under `set -e` that ends
          # the run before the commit, the push and the Pages dispatch below.
          # A menu-only sync must not be taken down by the specials directory.
          if [ -d assets/specials ]; then
            git add -- assets/specials
          fi
          if git diff --cached --quiet; then
            echo "No Toast changes — skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "flytrap-toast-bot"
          git config user.email "bot@theflytrapferndale.com"
          git commit -m "chore(toast): sync menu + specials [skip ci]"
          # Absorb any commit that landed on main since checkout, then push.
          git pull --rebase --autostash origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN commits don't trigger other workflows, so kick Pages
      # explicitly when something actually changed.
      #
      # `--ref main` makes GitHub resolve the branch to a SHA at dispatch time,
      # and that resolution lags the push by a second or two. On 2026-09-11 the
      # dispatch landed 3s after the push, resolved to the PARENT commit, and
      # deployed the previous sync's specials - a green run shipping stale
      # content, with no self-healing: the next run only commits if Toast moves
      # again, so the site stayed a sync behind. Wait for the API to actually see
      # the pushed SHA before dispatching. workflow_dispatch only accepts a
      # branch or tag as `ref`, so the SHA cannot simply be pinned.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          for i in $(seq 1 30); do
            SEEN=$(gh api "repos/$REPO/commits/main" --jq .sha 2>/dev/null || true)
            [ "$SEEN" = "$SHA" ] && break
            if [ "$i" -eq 30 ]; then
              echo "::error::main still reads $SEEN after 60s, expected $SHA. Not dispatching a deploy that would ship stale content."
              exit 1
            fi
            sleep 2
          done
          gh workflow run "Deploy to GitHub Pages" --ref main
          echo "Dispatched Pages deploy for $SHA." >> "$GITHUB_STEP_SUMMARY"

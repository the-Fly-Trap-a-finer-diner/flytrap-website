name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # dispatching "Post-deploy verify" below
  actions: write
  # opening and closing the "deploy failed" issue below
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy_retry_1.outputs.page_url || steps.deploy_retry_2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the sitemap step can find the last commit that
          # actually changed the page. blob:none keeps that cheap — the walk
          # needs commits and trees, not file contents, and the working tree
          # still materialises normally for the rsync below.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/configure-pages@v6
      - name: Stage site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='docs' \
            --exclude='test' \
            --exclude='apps-script' \
            --exclude='AGENTS.md' \
            --exclude='README.md' \
            --exclude='ROADMAP.md' \
            --exclude='LICENSE' \
            --exclude='.gitignore' \
            --exclude='.image-slots.state.json' \
            ./ _site/

      # Transpile the JSX ahead of time so visitors do not download and run a
      # 3 MB compiler before the page renders. Measured on a 4x-throttled CPU —
      # Lighthouse's mobile default — React mounts in 343 ms instead of 1515 ms,
      # and 137 ms instead of 1145 ms on a repeat visit, because the HTTP cache
      # removes Babel's download but not its parse-and-compile.
      #
      # The repo is untouched by this: it keeps its .jsx files and its Babel
      # script tag, so `python3 -m http.server` still works with no tooling and
      # AGENTS.md's no-build-step rule still holds for anyone working on the
      # site. Only the staged artifact is transformed.
      #
      # continue-on-error, and the script exits 0 on failure by design: it
      # rewrites index.html last, so a failure leaves _site holding exactly what
      # ships today. The worst case is that the site keeps its current speed.
      - name: Precompile the JSX
        continue-on-error: true
        run: node .github/scripts/precompile-jsx.mjs _site

      # Stamp <lastmod> with the date the page last actually changed.
      #
      # The only writer. specials-sync used to stamp the repo copy too, which
      # covered the specials but nothing else. #142 rewrote the schema, the preloads and every dish entry and
      # the sitemap still read 2026-08-10, two weeks stale, because Toast had
      # not moved. Anything that ships without touching Toast has the same
      # problem.
      #
      # Deliberately the last *content* commit, not the deploy date. A CI-only
      # or docs-only merge deploys the site without changing the page, and a
      # lastmod that reads "today" on every deploy is a lastmod Google learns to
      # ignore. Only the artifact is stamped; the repo copy is left alone.
      - name: Stamp the sitemap with the last content change
        run: |
          set -euo pipefail
          # %cs renders in the COMMIT's own timezone, not UTC. A commit made at
          # 00:50 UTC from a -04:00 machine reads as the previous day, which looks
          # like the stamp failed but is not — and for a Michigan restaurant the
          # local date is the more honest answer anyway.
          LAST=$(git log -1 --format=%cs -- \
            index.html data.js '*.jsx' '*.css' assets llms.txt 404.html)
          if [ -z "$LAST" ]; then
            echo "::warning::No content commit found — leaving sitemap lastmod as committed."
            exit 0
          fi
          if [ ! -f _site/sitemap.xml ]; then
            echo "::warning::No _site/sitemap.xml to stamp."
            exit 0
          fi
          # Write through a temp file rather than sed -i: the -i flag takes a
          # mandatory backup suffix on BSD sed and none on GNU, so the in-place
          # form silently does nothing on one of the two. This works on both,
          # which means it can be tested off the runner.
          sed -E "s#<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>#<lastmod>${LAST}</lastmod>#g" \
            _site/sitemap.xml > _site/sitemap.xml.tmp
          mv _site/sitemap.xml.tmp _site/sitemap.xml
          echo "Sitemap lastmod stamped $LAST" >> "$GITHUB_STEP_SUMMARY"
          grep lastmod _site/sitemap.xml

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # Deploy, and try again if GitHub's side hiccups.
      #
      # On 2026-11-20 the Toast sync committed Friday's specials at 6:07 PM ET
      # and this step failed 10 seconds later: "Fetching artifact metadata
      # failed ... Please re-run the deployment at a later time." The artifact
      # had uploaded fine (20.4 MB); GitHub just could not find it yet. Nothing
      # re-ran it. The next two syncs saw no new Toast changes, so they had no
      # reason to dispatch a deploy, and the site showed the previous week's
      # special for 16 hours until someone ran the sync by hand.
      #
      # So: two more tries, 1 and then 3 minutes apart, against the artifact
      # this run already uploaded. Only the last try is allowed to fail the
      # job, which is what fires the alert job below.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::Pages deploy failed; retrying in 60s."
          sleep 60
      - id: deploy_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before the last deploy try
        if: steps.deploy_retry_1.outcome == 'failure'
        run: |
          echo "::warning::Pages deploy failed twice; last try in 180s."
          sleep 180
      - id: deploy_retry_2
        if: steps.deploy_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # Verification is dispatched from here rather than keyed to this workflow
      # with `workflow_run`, because workflow_run never fires for a run that
      # GITHUB_TOKEN started - and the Toast bot dispatches this workflow with
      # exactly that token. Keyed the old way, the gate went quiet on 2026-08-24
      # and stayed quiet through a deploy that shipped the wrong commit.
      #
      # Passing the SHA is what makes it a gate rather than a ping: given one,
      # the verify asserts the live site actually serves this commit, and rolls
      # back to the last verified-good one if it does not. Do not drop this step
      # or the `deployed_sha` argument - a deploy stops being checked.
      - name: Verify what just went live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Post-deploy verify" --ref main \
            -f deployed_sha=${{ github.sha }}

      # A deploy got through, so any open "deploy failed" issue is resolved.
      - name: Close any open deploy-failed issue
        # Housekeeping only. It must never fail a deploy that already succeeded.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const MARKER = '<!-- flytrap-deploy-failed -->'
            const { data } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'deploy-failed', per_page: 100,
            })
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            for (const issue of data.filter((i) => (i.body || '').includes(MARKER))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Deployed cleanly in [this run](${runUrl}). Closing.`,
              })
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' })
              core.notice(`Closed #${issue.number}.`)
            }

  # Tell a person when a deploy fails, so new specials never sit unpublished
  # without anyone knowing.
  #
  # Post-deploy verify cannot catch this: the deploy dispatches it as its last
  # step, so a deploy that fails never starts it. Site health only checks that
  # the site is up, and a stale site is up. GitHub's own failure email goes to
  # whoever triggered the run, which for the Toast bot is github-actions[bot],
  # i.e. nobody.
  #
  # Same approach as .github/actions/incident: a GitHub issue assigned to the
  # people who can fix it, which GitHub emails. No secrets, no mail server.
  # One open issue at a time; a repeat failure comments on it (which emails
  # again), and the next successful deploy closes it.
  alert:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          # Set the INCIDENT_ASSIGNEES repo variable to change who gets emailed.
          ASSIGNEES: ${{ vars.INCIDENT_ASSIGNEES || 'ryankolean,smcclanaghan76' }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          script: |
            // Values arrive via env, never interpolated into the script.
            const { owner, repo } = context.repo
            const LABEL  = 'deploy-failed'
            const MARKER = '<!-- flytrap-deploy-failed -->'
            const sha = process.env.DEPLOY_SHA
            const assignees = (process.env.ASSIGNEES || '')
              .split(',').map((s) => s.trim()).filter(Boolean)
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${sha}`

            const body = [
              MARKER, ``,
              `## The site deploy failed, so the live site is behind \`main\``, ``,
              `The deploy of [\`${sha.slice(0, 7)}\`](${commitUrl}) failed three times.`,
              `Whatever that commit changed (new specials, for example) is not on`,
              `theflytrapferndale.com yet. The site is still up, showing the previous version.`, ``,
              `### What to do`, ``,
              `1. Open [the failed run](${runUrl}) and press **Re-run all jobs**.`,
              `2. If that fails too, check https://www.githubstatus.com for a Pages or Actions outage, and re-run once it clears.`,
              `3. Or go to **Actions > Deploy to GitHub Pages > Run workflow** to deploy the current \`main\`.`, ``,
              `This issue closes itself on the next successful deploy.`,
            ].join('\n')

            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            })
            const existing = open.find((i) => (i.body || '').includes(MARKER))
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body })
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Another deploy failed: [\`${sha.slice(0, 7)}\`](${commitUrl}), [run](${runUrl}).`,
              })
              core.warning(`Deploy failed again; commented on #${existing.number}.`)
              return
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL })
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'd93f0b',
                description: 'A Pages deploy failed; the live site is behind main',
              })
            }
            const { data: created } = await github.rest.issues.create({
              owner, repo, title: '[deploy failed] The live site is behind main', body, labels: [LABEL],
            })
            // Assign separately so one stale username cannot swallow the alert.
            try {
              await github.rest.issues.addAssignees({ owner, repo, issue_number: created.number, assignees })
            } catch (err) {
              core.warning(`Opened #${created.number} but could not assign ${assignees.join(', ')}: ${err.message}`)
            }
            core.notice(`Deploy failed; opened #${created.number} and notified ${assignees.join(', ')}.`)

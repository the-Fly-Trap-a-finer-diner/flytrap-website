name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the sitemap step can find the last commit that
          # actually changed the page. blob:none keeps that cheap — the walk
          # needs commits and trees, not file contents, and the working tree
          # still materialises normally for the rsync below.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/configure-pages@v6
      - name: Stage site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='docs' \
            --exclude='test' \
            --exclude='apps-script' \
            --exclude='AGENTS.md' \
            --exclude='README.md' \
            --exclude='ROADMAP.md' \
            --exclude='LICENSE' \
            --exclude='.gitignore' \
            --exclude='.image-slots.state.json' \
            ./ _site/

      # Transpile the JSX ahead of time so visitors do not download and run a
      # 3 MB compiler before the page renders. Measured on a 4x-throttled CPU —
      # Lighthouse's mobile default — React mounts in 343 ms instead of 1515 ms,
      # and 137 ms instead of 1145 ms on a repeat visit, because the HTTP cache
      # removes Babel's download but not its parse-and-compile.
      #
      # The repo is untouched by this: it keeps its .jsx files and its Babel
      # script tag, so `python3 -m http.server` still works with no tooling and
      # AGENTS.md's no-build-step rule still holds for anyone working on the
      # site. Only the staged artifact is transformed.
      #
      # continue-on-error, and the script exits 0 on failure by design: it
      # rewrites index.html last, so a failure leaves _site holding exactly what
      # ships today. The worst case is that the site keeps its current speed.
      - name: Precompile the JSX
        continue-on-error: true
        run: node .github/scripts/precompile-jsx.mjs _site

      # Stamp <lastmod> with the date the page last actually changed.
      #
      # The only writer. specials-sync used to stamp the repo copy too, which
      # covered the specials but nothing else. #142 rewrote the schema, the preloads and every dish entry and
      # the sitemap still read 2026-08-10, two weeks stale, because Toast had
      # not moved. Anything that ships without touching Toast has the same
      # problem.
      #
      # Deliberately the last *content* commit, not the deploy date. A CI-only
      # or docs-only merge deploys the site without changing the page, and a
      # lastmod that reads "today" on every deploy is a lastmod Google learns to
      # ignore. Only the artifact is stamped; the repo copy is left alone.
      - name: Stamp the sitemap with the last content change
        run: |
          set -euo pipefail
          # %cs renders in the COMMIT's own timezone, not UTC. A commit made at
          # 00:50 UTC from a -04:00 machine reads as the previous day, which looks
          # like the stamp failed but is not — and for a Michigan restaurant the
          # local date is the more honest answer anyway.
          LAST=$(git log -1 --format=%cs -- \
            index.html data.js '*.jsx' '*.css' assets llms.txt 404.html)
          if [ -z "$LAST" ]; then
            echo "::warning::No content commit found — leaving sitemap lastmod as committed."
            exit 0
          fi
          if [ ! -f _site/sitemap.xml ]; then
            echo "::warning::No _site/sitemap.xml to stamp."
            exit 0
          fi
          # Write through a temp file rather than sed -i: the -i flag takes a
          # mandatory backup suffix on BSD sed and none on GNU, so the in-place
          # form silently does nothing on one of the two. This works on both,
          # which means it can be tested off the runner.
          sed -E "s#<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>#<lastmod>${LAST}</lastmod>#g" \
            _site/sitemap.xml > _site/sitemap.xml.tmp
          mv _site/sitemap.xml.tmp _site/sitemap.xml
          echo "Sitemap lastmod stamped $LAST" >> "$GITHUB_STEP_SUMMARY"
          grep lastmod _site/sitemap.xml

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

name: Post-deploy verify

# Closes the loop on the deploy pipeline: after anything goes live, prove the
# site still works and prove the thing we just pushed is the thing being served.
#
# Nothing did this before. On 2026-08-21 the Toast sync committed a data.js that
# could not be parsed, Pages deployed it happily, and the site was blank for 25
# hours. Every gate in the path had a hole:
#
#   Guardrails  the sync commits with [skip ci], so it never ran — and it had no
#               JS parse check, so it would not have caught it either
#   Pages       rsync + upload. Never looks at what it is shipping
#   Tests       73 of them, covering this exact serializer, never run in CI
#
# This runs on `workflow_run` after "Deploy to GitHub Pages" completes, which
# covers every path to production — the Toast bot, a merged PR, a manual
# dispatch — instead of only the sync. [skip ci] cannot suppress it, because it
# keys off the deploy workflow rather than off the push.
#
# The check itself is .github/scripts/site-health.mjs: it fetches the live site,
# parses the live data.js, and loads the page in headless Chrome to confirm React
# actually mounts. Status codes alone would have called the outage healthy — the
# broken site served 200 for every single file.
#
# Retries are generous on purpose. Pages fronts a CDN, so "not live yet" and
# "broken" look identical for the first minute or so. Failing fast here would
# mean a false alarm on every deploy.

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Base URL to verify'
        type: string
        default: 'https://theflytrapferndale.com'

permissions:
  # write: the rollback pushes a restore commit to main when a synced deploy
  # fails verification, and records the last-known-good ref on every green run.
  contents: write
  issues: write
  # dispatching the Pages redeploy after a rollback push
  actions: write

concurrency:
  group: post-deploy-verify
  cancel-in-progress: true

jobs:
  verify:
    # A deploy that already failed needs no verifying — the deploy's own red X is
    # the signal. Only verify what actually claims to have shipped.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit that was deployed
        uses: actions/checkout@v7
        with:
          # Full history: the rollback restores files from an older commit, and a
          # shallow clone would not have it.
          fetch-depth: 0
          # For a workflow_run, head_sha is the commit Pages built from. Checking
          # out that exact commit is what makes the freshness check meaningful:
          # anything else and we would be comparing the live site against a
          # different revision than the one that just deployed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Expected data.js blob
        id: expected
        run: echo "sha=$(git hash-object data.js)" >> "$GITHUB_OUTPUT"

      # The last commit confirmed working on the live site, kept in a custom ref
      # rather than a branch or a tag so it clutters nobody's clone and triggers
      # no workflows. Recording it is what makes rollback safe: during the first
      # outage f3359d7 and e1f39a4 were both broken back to back, so rolling back
      # one commit would have landed on another blank site.
      - name: Read the last-known-good ref
        id: lkg
        run: |
          git fetch --quiet origin '+refs/verified/last-known-good:refs/verified/last-known-good' 2>/dev/null || true
          echo "sha=$(git rev-parse --verify --quiet refs/verified/last-known-good || true)" >> "$GITHUB_OUTPUT"

      - name: Verify the live site
        id: health
        # Never fail the step: the alerting below has to run either way, and it
        # is what closes an open incident when a deploy fixes the site.
        continue-on-error: true
        env:
          SITE_URL: ${{ inputs.site_url || 'https://theflytrapferndale.com' }}
          # Only assert freshness for a real deploy. On a manual dispatch the
          # checkout is main's tip, which may legitimately be ahead of what is
          # live, and demanding a match would fail for no good reason.
          EXPECT_DATA_JS_SHA: ${{ github.event_name == 'workflow_run' && steps.expected.outputs.sha || '' }}
          # Up to ~5 attempts over ~4 minutes. Pages propagation is the slow part;
          # a genuinely broken site fails all five just as fast as it fails one.
          ATTEMPTS: '5'
          RETRY_DELAY_MS: '45000'
        run: node .github/scripts/site-health.mjs

      - name: Record this commit as verified-good
        if: steps.health.outcome == 'success'
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git push --force --quiet origin "$DEPLOYED_SHA:refs/verified/last-known-good"
          echo "Recorded $DEPLOYED_SHA as the last verified-good deploy." >> "$GITHUB_STEP_SUMMARY"

      # Only on a real deploy. A manual dispatch verifies whatever is live, which
      # may be older than the checkout, and rolling back off the back of that
      # would be rolling back to a commit nobody deployed.
      - name: Roll back to the last verified-good commit
        id: rollback
        if: steps.health.outcome != 'success' && github.event_name == 'workflow_run'
        env:
          LKG_SHA: ${{ steps.lkg.outputs.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/rollback.mjs

      # Same incident issue the scheduled monitor uses, so a broken deploy and a
      # broken site are one thread rather than two competing ones — and a deploy
      # that fixes an outage closes the issue the monitor opened.
      - name: Open, update or close the incident
        uses: ./.github/actions/incident
        with:
          state: ${{ steps.health.outcome == 'success' && 'healthy' || 'failing' }}
          summary: |
            ${{ steps.health.outputs.summary }}

            ${{ steps.rollback.outputs.note }}
          source: post-deploy verify
          site-url: ${{ inputs.site_url || 'https://theflytrapferndale.com' }}
          assignees: ${{ vars.INCIDENT_ASSIGNEES || 'ryankolean,smcclanaghan76' }}
          token: ${{ github.token }}

      - name: Say what broke
        if: steps.health.outcome != 'success'
        # Expression values go through env, never straight into the shell — the
        # standard guard against workflow command injection.
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "::error::The site failed verification after deploying $DEPLOYED_SHA."
          echo "::error::The full check table is in the job summary."
          echo
          echo "To roll back: revert $DEPLOYED_SHA on main — Pages redeploys on push."
          echo "If the Toast sync wrote it, fix the Toast item, then re-run the sync"
          echo "with force=true to regenerate data.js."
          exit 1
